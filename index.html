<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>날샘 NALSSAM 아카이브</title>
  <meta name="description" content="대전대신고등학교 환경·생태 동아리 날샘(NALSSAM)의 활동 기록 · 외부 대회 디렉터리 · 보고서 양식" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 240 172'%3E%3Cg fill='none' stroke='%232F8A3B' stroke-width='14' stroke-linejoin='round'%3E%3Cpath d='M120 14 C136 42 150 70 146 98 C143 118 97 118 94 98 C90 70 104 42 120 14 Z'/%3E%3Cpath d='M101 114 C80 94 71 70 72 40 C93 54 106 72 112 96 Z'/%3E%3Cpath d='M139 114 C160 94 169 70 168 40 C147 54 134 72 128 96 Z'/%3E%3Cpath d='M92 126 C64 124 42 108 26 78 C54 82 76 94 92 110 Z'/%3E%3Cpath d='M148 126 C176 124 198 108 214 78 C186 82 164 94 148 110 Z'/%3E%3C/g%3E%3Crect x='30' y='112' width='180' height='50' rx='25' fill='%235FB236'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..800,100;1,9..144,300..800,100&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="assets/css/style.css?v=3.1.1" />
</head>
<body>
  <!-- NALSSAM 로고 공용 그라데이션 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <linearGradient id="nlsPetal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F6B2C"/><stop offset="0.55" stop-color="#2F8A3B"/><stop offset="1" stop-color="#5FB236"/></linearGradient>
      <linearGradient id="nlsMetal" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="#F4FBEF"/><stop offset="0.35" stop-color="#B9C9BD"/><stop offset="0.6" stop-color="#E7F1E4"/><stop offset="1" stop-color="#5FB236"/></linearGradient>
      <linearGradient id="nlsPlate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2F8A3B"/><stop offset="1" stop-color="#86C93F"/></linearGradient>
    </defs>
  </svg>  <!-- 배경: 모눈 종이 + 떠다니는 빛 -->
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"><span></span><span></span><span></span></div>

  <header class="nav-wrap">
    <nav class="nav" aria-label="주요 메뉴">
      <a class="brand" href="#/" aria-label="날샘 아카이브 홈">
        <span class="brand-logo" id="brandLogo" aria-hidden="true"></span>
        <span class="brand-name">날샘<em>NALSSAM</em></span>
      </a>
      <div class="nav-links">
        <a href="#/" data-nav="home">홈</a>
        <a href="#/archive" data-nav="archive">활동 기록</a>
        <a href="#/contests" data-nav="contests">대회 아카이브</a>
        <a href="#/report" data-nav="report">보고서 양식</a>
        <a href="#/me" data-nav="me">내 기록</a>
      </div>
      <div class="nav-side">
        <span class="db-pill" id="dbPill" title="데이터 연결 상태">로컬</span>
        <button class="btn btn-soft btn-sm" id="authBtn" type="button">로그인</button>
        <button class="nav-burger" id="burger" type="button" aria-label="메뉴 열기" aria-expanded="false"><span></span><span></span></button>
      </div>
    </nav>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="footer">
    <div class="footer-inner">
      <div>
        <strong>날샘 NALSSAM</strong> · 대전대신고등학교 환경·생태 동아리
        <p class="muted">자라나는 기록을 함께 쌓습니다.</p>
      </div>
      <div class="footer-links">
        <a href="#/archive">활동 기록</a>
        <a href="#/contests">대회 아카이브</a>
        <a href="#/report">보고서 양식</a>
        <a href="#/me">내 기록</a>
      </div>
    </div>
  </footer>

  <!-- 발표 모드 (HTML 슬라이드) -->
  <div class="deck" id="deck" hidden role="dialog" aria-modal="true" aria-label="발표 모드">
    <div class="deck-stage" id="deckStage"></div>
    <div class="deck-ui">
      <button type="button" class="deck-btn" data-deck="prev" aria-label="이전 슬라이드">←</button>
      <span class="deck-count" id="deckCount">1 / 1</span>
      <button type="button" class="deck-btn" data-deck="next" aria-label="다음 슬라이드">→</button>
      <button type="button" class="deck-btn" data-deck="full" aria-label="전체 화면">⛶</button>
      <button type="button" class="deck-btn" data-deck="close" aria-label="발표 모드 닫기">✕</button>
    </div>
    <div class="deck-progress"><span id="deckBar"></span></div>
  </div>

  <!-- 로그인 모달 -->
  <dialog class="modal" id="authModal">
    <form method="dialog" class="modal-body" id="authForm">
      <div class="modal-leaf" aria-hidden="true">🌿</div>
      <h3>날샘 부원 로그인</h3>
      <p class="muted" id="authHint">학교 메일(@dshs.kr)을 적으면 로그인 링크를 보내드려요. 비밀번호는 필요 없어요.</p>
      <input class="input" type="email" id="authEmail" placeholder="학번@dshs.kr" autocomplete="email" />
      <button class="btn btn-primary" id="authSend" type="button">로그인 링크 받기</button>
      <p class="muted modal-note">메일이 안 보이면 스팸함도 확인해 주세요. 링크는 1시간 동안 쓸 수 있어요.</p>
      <button class="btn btn-google" id="authGoogle" type="button" hidden>
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
        Google 학교 계정으로 계속하기
      </button>
      <div class="modal-actions"><button class="btn btn-ghost btn-sm" value="cancel" type="submit">닫기</button></div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js?v=3.1.1"></script>
  <script src="assets/js/logo.js?v=3.1.1"></script>
  <script src="assets/js/data.js?v=3.1.1"></script>
  <script src="assets/js/app.js?v=3.1.1"></script>
</body>
</html>
